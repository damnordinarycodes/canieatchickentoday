name: chicken-day
region: blr
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm run build
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    envs:
      - key: NODE_ENV
        value: "production"
      - key: MONGODB_URI
        value: ${chicken-day-db.DATABASE_URL}
        type: SECRET
    routes:
      - path: /
databases:
  - name: chicken-day-db
    engine: MONGODB
    production: true
    cluster_name: chicken-day-db
    version: "6"
